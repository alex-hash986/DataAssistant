services:
  web:
    build: .
    container_name: data-assistant
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/outputs:/app/storage/outputs
      - ./storage/chats:/app/storage/chats
    restart: unless-stopped
